name: Build Pico 4 APK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # 4.6.3 crashes on Pico 4 at startup (eye-tracked foveation with Vulkan), 4.6.2 does not.
  GODOT_VERSION: 4.6.2
  VENDORS_VERSION: 4.3.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Install OpenXR vendors plugin
        run: |
          curl -fsSL -o /tmp/vendors.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}-stable/godotopenxrvendorsaddon.zip"
          unzip -q /tmp/vendors.zip -d /tmp/vendors
          rm -rf addons/godotopenxrvendors
          cp -r /tmp/vendors/asset/addons/godotopenxrvendors addons/

      - name: Configure Android export
        run: |
          keytool -genkeypair -keystore ~/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import

      - name: Run tests
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . res://tests/test_map_info.tscn

      - name: Export Pico 4 APK
        run: |
          mkdir -p build
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . \
            --install-android-build-template --export-debug "Pico 4" build/BoredSaber-Pico4.apk
          test -f build/BoredSaber-Pico4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BoredSaber-Pico4
          path: build/BoredSaber-Pico4.apk
